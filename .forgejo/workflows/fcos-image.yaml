---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# Day-2 only: this runs on Forgejo, which runs in the cluster this image
# provisions nodes for. It can't be part of initial node bring-up (chicken
# /egg) -- that path builds locally and images via `just fcos install`
# instead, with Forgejo never involved. This workflow just calls the same
# `just fcos build`/`push` recipes used locally, so there's one source of
# truth for the build -- it can't silently drift from what you run by hand.
name: "FCOS Image"

on:
  push:
    branches: ["main"]
    paths:
      - fcos/**
      - .forgejo/workflows/fcos-image.yaml
  schedule:
    - cron: 0 3 * * 6 # 3AM every Saturday -- picks up Fedora/package updates even with no repo changes
  workflow_dispatch: {}

concurrency:
  group: ${{ forgejo.workflow_ref }}-${{ forgejo.event.number || forgejo.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: FCOS Image - Build & Push
    runs-on: podman
    env:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compute next date-based tag
        id: tag
        run: |
          year_month="$(date -u +%Y.%m)"
          body="$(curl -fsS -u "${{ forgejo.actor }}:${{ secrets.TOKEN_PACKAGES }}" "https://git.noms.tv/v2/homelab/fcos-bootc/tags/list" || true)"
          max=-1
          for existing in $(grep -oE "\"${year_month//./\\.}\.[0-9]+\"" <<< "$body" | tr -d '"'); do
            n="${existing##*.}"
            [ "$n" -gt "$max" ] && max="$n"
          done
          tag="${year_month}.$((max + 1))"
          echo "Next tag: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Install 1Password CLI
        uses: 1Password/install-cli-action@1a3160d5e9de1ae0803eaa08a88746f5ae3daa50 # v4.1.0

      - name: Verify 1Password auth
        run: op user get --me

      - name: Setup Mise
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          cache: false
          tool_versions: |
            just latest
          github_token: ${{ secrets.TOKEN_GITHUB }}

      - name: Install podman
        run: apt-get update && apt-get install -y podman

      - name: Build and push
        run: |
          just fcos build ${{ steps.tag.outputs.tag }}
          just fcos push ${{ steps.tag.outputs.tag }}
