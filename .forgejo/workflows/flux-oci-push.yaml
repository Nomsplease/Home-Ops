---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Push OCI Artifact

on:
  push:
    branches:
      - main
    paths:
      - kubernetes/**
      - .sourceignore
  workflow_dispatch:

concurrency:
  group: oci-push-${{ forgejo.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # renovate: datasource=github-releases depName=fluxcd/flux2
  FLUX_VERSION: v2.10.0
  # renovate: datasource=github-releases depName=sigstore/cosign
  COSIGN_VERSION: v3.1.4

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
    outputs:
      digest-url: ${{ steps.push.outputs.digest-url }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install 1Password CLI
        uses: 1Password/install-cli-action@1a3160d5e9de1ae0803eaa08a88746f5ae3daa50 # v4.1.0

      - name: Install Flux CLI
        run: |
          curl -sLO "https://github.com/fluxcd/flux2/releases/download/${FLUX_VERSION}/flux_${FLUX_VERSION#v}_linux_amd64.tar.gz"
          tar xzf "flux_${FLUX_VERSION#v}_linux_amd64.tar.gz"
          mv flux /usr/local/bin/

      - name: Push to Forgejo
        id: push
        run: |
          DIGEST_URL=$(flux push artifact \
            oci://git.noms.tv/homelab/home-ops:${{ forgejo.sha }} \
            --path=. \
            --source=${{ forgejo.server_url }}/${{ forgejo.repository }} \
            --revision=${{ forgejo.ref_name }}@sha1:${{ forgejo.sha }} \
            --creds="$(op read "op://Kubernetes/forgejo-registry-bot/username"):$(op read "op://Kubernetes/forgejo-registry-bot/password")" \
            --output json | \
            jq -r '.repository + "@" + .digest')
          echo "digest-url=$DIGEST_URL" >> "$FORGEJO_OUTPUT"

      - name: Tag main
        run: |
          flux tag artifact oci://git.noms.tv/homelab/home-ops:${{ forgejo.sha }} \
            --tag main \
            --creds="$(op read "op://Kubernetes/forgejo-registry-bot/username"):$(op read "op://Kubernetes/forgejo-registry-bot/password")"

      - name: Push to apoci registry
        run: |
          flux push artifact \
            oci://registry.noms.tv/home-ops:${{ forgejo.sha }} \
            --path=. \
            --source=${{ forgejo.server_url }}/${{ forgejo.repository }} \
            --revision=${{ forgejo.ref_name }}@sha1:${{ forgejo.sha }} \
            --creds="registry:$(op read "op://Kubernetes/Apoci/PushToken")"
          flux tag artifact oci://registry.noms.tv/home-ops:${{ forgejo.sha }} \
            --tag main \
            --creds="registry:$(op read "op://Kubernetes/Apoci/PushToken")"
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: push
    env:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
    steps:
      - name: Install 1Password CLI
        uses: 1Password/install-cli-action@1a3160d5e9de1ae0803eaa08a88746f5ae3daa50 # v4.1.0

      - name: Install Cosign
        run: |
          curl -sLO "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
          chmod +x cosign-linux-amd64
          mv cosign-linux-amd64 /usr/local/bin/cosign

      - name: Sign OCI artifact
        env:
          DIGEST_URL: ${{ needs.push.outputs.digest-url }}
        run: |-
          export COSIGN_KEY="$(op read "op://Kubernetes/cosign/private-key")"
          export COSIGN_PASSWORD="$(op read "op://Kubernetes/cosign/password")"
          cosign sign --yes \
            --key env://COSIGN_KEY \
            --registry-username="$(op read "op://Kubernetes/forgejo-registry-bot/username")" \
            --registry-password="$(op read "op://Kubernetes/forgejo-registry-bot/password")" \
            "$DIGEST_URL"

      - name: Trigger Flux reconciliation
        run: |-
          WEBHOOK_TOKEN="$(op read "op://Kubernetes/flux/FLUX_WEBHOOK_TOKEN")"
          WEBHOOK_URL="$(op read "op://Kubernetes/flux/FLUX_WEBHOOK_URL")"
          SIGNATURE=$(printf '{}' | openssl dgst -sha256 -r -hmac "${WEBHOOK_TOKEN}" | awk '{print $1}')
          HTTP_STATUS=$(curl -s -o /dev/null -w '%{http_code}' -X POST "${WEBHOOK_URL}" -H 'Content-Type: application/json' -H 'X-GitHub-Event: push' -H "X-Hub-Signature-256: sha256=${SIGNATURE}" -d '{}')
          echo "Flux webhook response: HTTP ${HTTP_STATUS}"
          test "${HTTP_STATUS}" = "200"
