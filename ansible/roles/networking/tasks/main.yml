---
- name: Set this node's hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: Configure the bond0 interface
  community.general.nmcli:
    type: bond
    conn_name: bond0
    ifname: bond0
    mode: "{{ bond_mode }}"
    mac: "{{ bond_members[-1].mac }}"
    miimon: 1000
    mtu: 9000
    method4: auto
    method6: auto
    state: present
  register: bond0_result

- name: Configure VLAN sub-interfaces on bond0
  community.general.nmcli:
    type: vlan
    conn_name: "bond0.{{ item.id }}"
    ifname: "bond0.{{ item.id }}"
    vlandev: bond0
    vlanid: "{{ item.id }}"
    mtu: 9000
    method4: disabled
    method6: "{{ item.ipv6 }}"
    state: present
  loop: "{{ bond_vlans }}"
  loop_control:
    label: "{{ item.id }}"
  register: bond_vlan_result

# state:present only updates the saved profile; cycle to apply ipv6.method.
- name: Reactivate changed VLAN sub-interfaces
  community.general.nmcli:
    conn_name: "bond0.{{ item.item.id }}"
    state: down
  loop: "{{ bond_vlan_result.results }}"
  loop_control:
    label: "{{ item.item.id }}"
  when: item is changed

- name: Bring the reactivated VLAN sub-interfaces back up
  community.general.nmcli:
    conn_name: "bond0.{{ item.item.id }}"
    state: up
  loop: "{{ bond_vlan_result.results }}"
  loop_control:
    label: "{{ item.item.id }}"
  when: item is changed

# nmcli lacks permanent-MAC matching for ethernet; hand-write keyfile instead.
- name: Write the bond0 member connections, matched by permanent MAC
  ansible.builtin.template:
    src: bond0-member.nmconnection.j2
    dest: "/etc/NetworkManager/system-connections/bond0-member-{{ idx }}.nmconnection"
    owner: root
    group: root
    mode: "0600"
  loop: "{{ bond_members }}"
  loop_control:
    index_var: idx
  register: bond_member_files

- name: Reload NetworkManager connection files
  ansible.builtin.command: nmcli connection reload
  when: bond_member_files is changed
  changed_when: true

- name: Activate the bond0 member connections
  community.general.nmcli:
    conn_name: "bond0-member-{{ idx }}"
    state: up
  loop: "{{ bond_members }}"
  loop_control:
    index_var: idx
  when: bond_member_files is changed
  async: 30
  poll: 0

# Bond mode change requires a reboot; switch LACP/LAG must match first.
- name: Reboot if the bond or its member connections changed
  ansible.builtin.reboot:
    reboot_timeout: 180
  when: bond0_result is changed or bond_member_files is changed
