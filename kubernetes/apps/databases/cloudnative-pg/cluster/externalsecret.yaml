        ACCESS_KEY_ID: "{{ .KWH_ACCESS_KEY_ID }}"
        SECRET_ACCESS_KEY: "{{ .KWH_SECRET_ACCESS_KEY }}"
        REGION: "us-east-1"
  dataFrom:
    - extract:
