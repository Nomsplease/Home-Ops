---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-s3-internal
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: postgres-s3-internal
    template:
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        ACCESS_KEY_ID: "{{ .INTERNAL_ACCESS_KEY_ID }}"
        SECRET_ACCESS_KEY: "{{ .INTERNAL_SECRET_ACCESS_KEY }}"
        REGION: "us-east-1"
  dataFrom:
    - extract:
        key: kopiur
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
