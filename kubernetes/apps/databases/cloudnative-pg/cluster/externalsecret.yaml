---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-s3-internal
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: postgres-s3-internal
    template:
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        ACCESS_KEY_ID: "{{ .MAIN_CLUSTER_INT_KEY_ID }}"
        SECRET_ACCESS_KEY: "{{ .MAIN_CLUSTER_INT_SECRET_KEY }}"
        REGION: "{{ .Region }}"
  dataFrom:
    - extract:
        key: Garage
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-s3-kwh
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: postgres-s3-kwh
    template:
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        ACCESS_KEY_ID: "{{ .MAIN_CLUSTER_KWH_KEY_ID }}"
        SECRET_ACCESS_KEY: "{{ .MAIN_CLUSTER_KWH_SECRET_KEY }}"
        REGION: "{{ .Region }}"
  dataFrom:
    - extract:
        key: Garage
