---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/barmancloud.cnpg.io/objectstore_v1.json
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: homelab-cnpg
spec:
  configuration:
    destinationPath: s3://homelab/cnpg
    endpointURL: https://truenas.services:9000
    endpointCA:
      name: rustfs-internal-ca
      key: ca.crt
    s3Credentials:
      accessKeyId:
        name: postgres-s3-internal
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: postgres-s3-internal
        key: SECRET_ACCESS_KEY
      region:
        name: postgres-s3-internal
        key: REGION
    wal:
      compression: zstd
    data:
      compression: gzip
  retentionPolicy: "14d"
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/barmancloud.cnpg.io/objectstore_v1.json
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: homelab-cnpg-kwh
spec:
  configuration:
    destinationPath: s3://homelab/cnpg
    endpointURL: https://10.3.10.10:9000
    endpointCA:
      name: rustfs-kwh-ca
      key: ca.crt
    s3Credentials:
      accessKeyId:
        name: postgres-s3-kwh
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: postgres-s3-kwh
        key: SECRET_ACCESS_KEY
      region:
        name: postgres-s3-kwh
        key: REGION
    data:
      compression: gzip
  retentionPolicy: "14d"