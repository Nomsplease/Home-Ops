---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/batch/v1/cronjob_v1.json
# After the timescaledb extension image in cluster.yaml is bumped, databases still
# reference the old extension version and reject every query until it is updated.
# ALTER EXTENSION must be the first statement in the session (-X, single -c), and
# is the only way in: a version check would fail against an outdated database.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-timescaledb-update
spec:
  concurrencyPolicy: Forbid
  schedule: "*/15 * * * *"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: update
              image: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie@sha256:d72ace96f5803b12c341bb5dac48532e8c1f92f69e8a717a59d779bfc038dea9
              command:
                - /bin/sh
                - -c
                - |
                  set -u
                  dbs=$(psql -X -Atc "select datname from pg_database where datallowconn and not datistemplate order by 1") || exit 1
                  rc=0
                  for db in $dbs; do
                    if out=$(psql -X -v ON_ERROR_STOP=1 -d "$db" -c "ALTER EXTENSION timescaledb UPDATE" 2>&1); then
                      echo "$db: ok"
                    elif echo "$out" | grep -q 'extension "timescaledb" does not exist'; then
                      echo "$db: no timescaledb, skipping"
                    else
                      echo "$db: FAILED: $out"
                      rc=1
                    fi
                  done
                  exit $rc
              env:
                - name: PGHOST
                  value: postgres-rw.databases.svc
                - name: PGSSLMODE
                  value: disable
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: cnpg-admin
                      key: username
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: cnpg-admin
                      key: password
