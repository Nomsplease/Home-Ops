---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: couchdb
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: couchdb-secret
    template:
      data:
        COUCHDB_USER: "{{ .ADMIN_USERNAME }}"
        COUCHDB_PASSWORD: "{{ .ADMIN_PASSWORD }}"
        COUCHDB_SECRET: "{{ .COOKIE_AUTH_SECRET }}"
        # https://github.com/vrtmrz/obsidian-livesync setup guide: CORS for Obsidian's
        # embedded Chromium origins, plus larger document/request size limits.
        local.ini: |
          [couchdb]
          max_document_size = 50000000

          [chttpd]
          require_valid_user = true
          max_http_request_size = 4294967296

          [chttpd_auth]
          require_valid_user = true

          [httpd]
          WWW-Authenticate = Basic realm="couchdb"
          enable_cors = true

          [cors]
          credentials = true
          origins = app://obsidian.md,capacitor://localhost,http://localhost
          headers = accept, authorization, content-type, origin, referer
          methods = GET, PUT, POST, HEAD, DELETE
          max_age = 3600
  dataFrom:
    - extract:
        key: couchdb
