---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: couchdb
spec:
  interval: 1h
  chart:
    spec:
      chart: couchdb
      version: "4.6.2"
      sourceRef:
        kind: HelmRepository
        name: couchdb
  values:
    clusterSize: 1
    createAdminSecret: false
    extraSecretName: couchdb-secret
    # https://github.com/vrtmrz/obsidian-livesync setup guide: CORS for Obsidian's
    # embedded Chromium origins, plus larger document/request size limits.
    couchdbConfig:
      couchdb:
        max_document_size: 50000000
      chttpd:
        require_valid_user: true
        max_http_request_size: 4294967296
      chttpd_auth:
        require_valid_user: true
      httpd:
        WWW-Authenticate: Basic realm="couchdb"
        enable_cors: true
      cors:
        credentials: true
        origins: app://obsidian.md,capacitor://localhost,http://localhost
        headers: accept, authorization, content-type, origin, referer
        methods: GET, PUT, POST, HEAD, DELETE
        max_age: 3600
    persistentVolume:
      enabled: true
      accessModes:
        - ${KOPIUR_ACCESSMODES:=ReadWriteOnce}
      size: ${KOPIUR_CAPACITY}
      storageClass: ${KOPIUR_STORAGECLASS:=ceph-block}
      # Must match the PVC the kopiur backup component creates (see ../ks.yaml)
      existingClaims:
        - claimName: couchdb
          volumeName: database-storage
