---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reitti
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: reitti
  values:
    controllers:
      reitti:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-nginx-conf:
            image:
              repository: ghcr.io/dedicatedcode/reitti-tile-cache
              tag: 5.9.0@sha256:53d0b673f3bb651124ac14924aa19b6aa352998bfa79682198ee0357a2d6e7ad
            command:
              - sh
              - -c
              - cp -r /etc/nginx/. /config/
        containers:
          app:
            image:
              repository: ghcr.io/dedicatedcode/reitti
              tag: 5.8.0@sha256:f8f31c7c99fe2631f79433fe4d6e9ff96c033dd3cdb74858f05f2edf164e7ec5
            env:
              DISABLE_LOCAL_LOGIN: "true"
              OIDC_ENABLED: "true"
              POSTGIS_DB: "{{ .Release.Name }}"
              POSTGIS_HOST: postgres-rw.databases.svc
              POSTGIS_USER: "{{ .Release.Name }}"
              POSTGIS_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: "{{ .Release.Name }}-postgres"
                    key: password
              REDIS_HOST: dragonfly.databases
              REDIS_DATABASE: "6"
              SERVER_PORT: &port 8080
              TILES_CACHE: http://reitti-tile-cache
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            probes:
              liveness: &probes
                enabled: false
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 2Gi
          tile-cache:
            image:
              repository: ghcr.io/dedicatedcode/reitti-tile-cache
              tag: 5.9.0@sha256:53d0b673f3bb651124ac14924aa19b6aa352998bfa79682198ee0357a2d6e7ad
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: *port
      tile-cache:
        ports:
          http:
            port: 80
    route:
      app:
        hostnames:
          - "location.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
      tile-cache:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        forceRename: "{{ .Release.Name }}-cache"
        size: 10Gi
        storageClass: ceph-block
        advancedMounts:
          reitti:
            tile-cache:
              - path: /var/cache/nginx
      nginx-conf:
        type: emptyDir
        advancedMounts:
          reitti:
            init-nginx-conf:
              - path: /config
            tile-cache:
              - path: /etc/nginx
      nginx-run:
        type: emptyDir
        advancedMounts:
          reitti:
            tile-cache:
              - path: /run