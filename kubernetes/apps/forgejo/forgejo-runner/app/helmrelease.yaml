# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo-runner
spec:
  chartRef:
    kind: OCIRepository
    name: forgejo-runner
  interval: 30m
  values:
    forgejo:
      url: http://forgejo-http:3000
      existingSecret: forgejo-runner-secret
    image:
      repository: data.forgejo.org/forgejo/runner
      tag: "13.2.0"
    plugin:
      image:
        repository: registry.erwanleboucher.dev/eleboucher/runner-k8s-plugin
    podLabels:
      app.kubernetes.io/component: forgejo-runner
    runnerConfig: |
      cache:
        enabled: true
        dir: /data/cache
        port: 8088
        proxy_port: 8089
      container:
        docker_host: "-"
        workdir_parent: shared/workdir
        options: --device /dev/kvm
      host:
        workdir_parent: /data/act
      kubernetes:
        namespace: forgejo
        poll_timeout: 10m
      log:
        level: info
      plugins:
        k8s:
          address: "unix:///plugin/forgejo-runner-k8s.sock"
          options:
            namespace: forgejo
            poll_timeout: 10m
            labels: "app.kubernetes.io/name=forgejo-runner-instance,egress.home.arpa/custom-egress=true"
            resources: |
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
      runner:
        capacity: 8
        labels:
          - ubuntu-latest:k8s:/config/podspec-default.yaml
          - default:k8s:/config/podspec-default.yaml
          - docker:k8s:/config/podspec-dind.yaml
          - kvm:k8s:/config/podspec-dind-kvm.yaml
          - multiarch:k8s:/config/podspec-dind.yaml  # you need binfmt-misc extension for multiarch
          - podman:k8s:/config/podspec-podman.yaml  # podman is daemonless -- no dind sidecar, just a privileged main container
        timeout: 3h
        shutdown_timeout: 3m
    podSpecs:
      podspec-default.yaml: |
        imagePullSecrets:
          - name: forgejo-registry-pull-secret
        containers:
          - env:
              - name: DEBIAN_FRONTEND
                value: noninteractive
              - name: NODE
                valueFrom:
                  fieldRef:
                    fieldPath: status.hostIP
              - name: TALOSCONFIG
                value: /var/run/secrets/talos.dev/config
            image: ghcr.io/bjw-s-labs/forgejo-runner:ubuntu-24.04@sha256:fea688b875acdce4e7c786d117b30c1b0203271b23e77d80c306b373d9f5422f
            imagePullPolicy: IfNotPresent
            name: main
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                cpu: 500m
                memory: 4Gi
            volumeMounts:
              - name: talos-secrets
                mountPath: /var/run/secrets/talos.dev
                readOnly: true
        volumes:
          - name: talos-secrets
            secret:
              secretName: talos-api-access
        restartPolicy: Never
      podspec-dind.yaml: |
        initContainers:
          - name: dind
            image: docker:29-dind
            securityContext:
              privileged: true
            restartPolicy: Always
            env:
              - name: DOCKER_TLS_CERTDIR
                value: /certs
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                cpu: 500m
                memory: 8Gi
            volumeMounts:
              - name: docker-storage
                mountPath: /var/lib/docker
              - name: docker-certs
                mountPath: /certs
            startupProbe:
              exec:
                command:
                  - sh
                  - -c
                  - docker --tlsverify --tlscacert=/certs/client/ca.pem --tlscert=/certs/client/cert.pem --tlskey=/certs/client/key.pem -H tcp://localhost:2376 info
              initialDelaySeconds: 5
              periodSeconds: 1
              failureThreshold: 30
        containers:
          - env:
              - name: DEBIAN_FRONTEND
                value: noninteractive
              - name: DOCKER_HOST
                value: tcp://localhost:2376
              - name: DOCKER_TLS_VERIFY
                value: "1"
              - name: DOCKER_CERT_PATH
                value: /certs/client
            image: ghcr.io/bjw-s-labs/forgejo-runner:ubuntu-24.04@sha256:fea688b875acdce4e7c786d117b30c1b0203271b23e77d80c306b373d9f5422f
            imagePullPolicy: IfNotPresent
            name: main
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                cpu: 500m
                memory: 4Gi
            volumeMounts:
              - name: docker-certs
                mountPath: /certs
                readOnly: true
        volumes:
          - name: docker-storage
            emptyDir: {}
          - name: docker-certs
            emptyDir: {}
        restartPolicy: Never
      podspec-dind-kvm.yaml: |
        imagePullSecrets:
          - name: forgejo-registry-pull-secret
        initContainers:
          - name: dind
            image: docker:29-dind
            securityContext:
              privileged: true
            restartPolicy: Always
            env:
              - name: DOCKER_TLS_CERTDIR
                value: /certs
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                cpu: 500m
                memory: 8Gi
            volumeMounts:
              - name: docker-storage
                mountPath: /var/lib/docker
              - name: docker-certs
                mountPath: /certs
              - name: kvm
                mountPath: /dev/kvm
            startupProbe:
              exec:
                command:
                  - sh
                  - -c
                  - docker --tlsverify --tlscacert=/certs/client/ca.pem --tlscert=/certs/client/cert.pem --tlskey=/certs/client/key.pem -H tcp://localhost:2376 info
              initialDelaySeconds: 5
              periodSeconds: 1
              failureThreshold: 30
        containers:
          - env:
              - name: DEBIAN_FRONTEND
                value: noninteractive
              - name: DOCKER_HOST
                value: tcp://localhost:2376
              - name: DOCKER_TLS_VERIFY
                value: "1"
              - name: DOCKER_CERT_PATH
                value: /certs/client
            image: ghcr.io/bjw-s-labs/forgejo-runner:ubuntu-24.04@sha256:fea688b875acdce4e7c786d117b30c1b0203271b23e77d80c306b373d9f5422f
            imagePullPolicy: IfNotPresent
            name: main
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                cpu: 500m
                memory: 8Gi
            volumeMounts:
              - name: docker-certs
                mountPath: /certs
                readOnly: true
              - name: kvm
                mountPath: /dev/kvm
        volumes:
          - name: docker-storage
            emptyDir: {}
          - name: docker-certs
            emptyDir: {}
          - name: kvm
            hostPath:
              path: /dev/kvm
              type: CharDevice
        restartPolicy: Never
      podspec-podman.yaml: |
        imagePullSecrets:
          - name: forgejo-registry-pull-secret
        containers:
          - name: main
            securityContext:
              privileged: true
            env:
              - name: DEBIAN_FRONTEND
                value: noninteractive
            image: ghcr.io/bjw-s-labs/forgejo-runner:ubuntu-24.04@sha256:fea688b875acdce4e7c786d117b30c1b0203271b23e77d80c306b373d9f5422f
            imagePullPolicy: IfNotPresent
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                cpu: 500m
                memory: 8Gi
            volumeMounts:
              - name: podman-storage
                mountPath: /var/lib/containers
        volumes:
          - name: podman-storage
            emptyDir: {}
        restartPolicy: Never
