---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app forgejo
spec:
  components:
    - ../../../../components/anubis
    - ../../../../components/kopiur/backup
    - ../../../../components/postgres/cert
  dependsOn:
    - name: cloudnative-pg-cluster
      namespace: databases
    - name: dragonfly
      namespace: databases
    - name: kopiur
      namespace: kopiur-system
    - name: pocket-id
      namespace: security
  interval: 1h
  path: ./kubernetes/apps/forgejo/forgejo/app
  postBuild:
    substitute:
      APP: *app
      ANUBIS_TARGET: "http://forgejo-http.forgejo.svc:3000"
      KOPIUR_CAPACITY: 50Gi
      APP_NAMESPACE: forgejo
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true 
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: forgejo
  wait: false