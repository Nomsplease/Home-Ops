---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: agones
spec:
  interval: 1h
  # CRDs are vendored+patched in ./crds.yaml (see its header comment)
  install:
    crds: Skip
  upgrade:
    crds: Skip
  chart:
    spec:
      chart: agones
      version: "1.60.0"
      sourceRef:
        kind: HelmRepository
        name: agones
  values:
    gameservers:
      namespaces:
        - games
    agones:
      crds:
        install: false
      controller:
        replicas: 1
      ping:
        install: false
      allocator:
        install: false
