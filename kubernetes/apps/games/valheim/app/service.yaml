---
apiVersion: v1
kind: Service
metadata:
  name: valheim
  annotations:
    lbipam.cilium.io/ips: 10.1.20.32
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  ports:
    - name: game
      port: 2456
      targetPort: 2456
      protocol: UDP
    - name: query
      port: 2457
      targetPort: 2457
      protocol: UDP
  selector:
    game: valheim
