---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bambuddy
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: bambuddy
  values:
    controllers:
      bambuddy:
        forceRename: bambuddy
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/maziggy/bambuddy
              tag: 1.3.1@sha256:3b63f6b02ab77075716a6295d6f8ca27b98283580753b911b3841dcd9972a110
            securityContext:
              capabilities:
                add:
                  - NET_BIND_SERVICE
            env:
              POSTGRES_USER:
                valueFrom:
                  secretKeyRef:
                    name: bambuddy-postgres
                    key: username
              POSTGRES_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: bambuddy-postgres
                    key: password
              POSTGRES_HOST:
                valueFrom:
                  secretKeyRef:
                    name: bambuddy-postgres
                    key: host
              POSTGRES_DB:
                valueFrom:
                  secretKeyRef:
                    name: bambuddy-postgres
                    key: database
              DATABASE_URL:
                value: "postgresql+asyncpg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST)/$(POSTGRES_DB)"
                dependsOn:
                  - POSTGRES_USER
                  - POSTGRES_PASSWORD
                  - POSTGRES_HOST
                  - POSTGRES_DB
              PUID: 1000
              PGID: 1000
              PORT: 8080
              VIRTUAL_PRINTER_PASV_ADDRESS: 10.1.10.28
              TZ: ${TIMEZONE}
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 1Gi

      bambu-studio-api:
        forceRename: bambu-studio-api
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchExpressions:
                      - key: app.kubernetes.io/name
                        operator: In
                        values:
                          - bambuddy
                      - key: app.kubernetes.io/controller
                        operator: In
                        values:
                          - bambuddy
                  topologyKey: kubernetes.io/hostname
        containers:
          app:
            image:
              repository: ghcr.io/maziggy/bambu-studio-api
              tag: bambuddy-1.3.1@sha256:7dbe1531e74a6ec3cb3fc390cd399882c62511f294d25425537efd0649d227b8
            env:
              NODE_ENV: production
              PORT: 3000
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true


    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000

    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        advancedMounts:
          bambuddy:
            app:
              - path: /app/data
                subPath: bambuddy/data
              - path: /app/logs
                subPath: bambuddy/logs
              - path: /app/data/backups
                subPath: bambuddy/backups
          bambu-studio-api:
            app:
              - path: /app/data
                subPath: bambu-studio-api/data

    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: bambuddy
                port: http

    service:
      bambuddy:
        controller: bambuddy
        forceRename: bambuddy
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: 10.1.10.28
        ports:
          http:
            port: 8080
      bambu-studio-api:
        controller: bambu-studio-api
        forceRename: bambu-studio-api
        ports:
          http:
            port: 3000
