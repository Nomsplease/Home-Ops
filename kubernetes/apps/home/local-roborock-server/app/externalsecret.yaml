---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: local-roborock-server
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: local-roborock-server
    template:
      data:
        config.toml: |
          [network]
          stack_fqdn = "api-roborock.hme.${SECRET_DOMAIN}"
          bind_host = "0.0.0.0"
          https_port = 555
          mqtt_tls_port = 8881
          region = "us"

          [broker]
          mode = "embedded"
          host = "127.0.0.1"
          port = 18830
          mosquitto_binary = "mosquitto"
          enable_topic_bridge = true

          [storage]
          data_dir = "/data"

          [tls]
          mode = "provided"
          base_domain = ""
          email = ""
          cloudflare_token_file = ""
          renew_days_before = 30
          renew_check_seconds = 43200
          acme_server = "zerossl"
          acme_eab_kid = ""
          acme_eab_hmac_key = ""
          acme_eab_kid_file = ""
          acme_eab_hmac_key_file = ""
          cert_file = "/data/certs/fullchain.pem"
          key_file = "/data/certs/privkey.pem"

          [admin]
          password_hash = "{{ .password_hash }}"
          session_secret = "{{ .session_secret }}"
          session_ttl_seconds = 86400
          protocol_auth_enabled = true
          new_connections_enabled = true
          protocol_login_email = "{{ .protocol_login_email }}"
          protocol_login_pin_hash = "{{ .protocol_login_pin_hash }}"
  dataFrom:
    - extract:
        key: local-roborock-server
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: local-roborock-server-certs
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: local-roborock-server-certs
  data:
    - secretKey: fullchain.pem
      remoteRef:
        key: ${SECRET_DOMAIN_CLEAN}-tls
        property: tls.crt
        decodingStrategy: Base64
    - secretKey: privkey.pem
      remoteRef:
        key: ${SECRET_DOMAIN_CLEAN}-tls
        property: tls.key
        decodingStrategy: Base64
