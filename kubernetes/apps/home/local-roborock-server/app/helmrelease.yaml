---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: local-roborock-server
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: local-roborock-server
  values:
    controllers:
      local-roborock-server:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/python-roborock/local_roborock_server
              tag: 1.2.1@sha256:0f3d0dd05f14315273df5622d43008b2665c24b2fed79277822d4c9184eab158
            securityContext:
              capabilities:
                add:
                  - NET_BIND_SERVICE
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /admin
                    port: 555
                    scheme: HTTPS
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /admin
                    port: 555
                    scheme: HTTPS
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /admin
                    port: 555
                    scheme: HTTPS
                  periodSeconds: 5
                  failureThreshold: 30
            resources:
              requests:
                cpu: 100m
              limits:
                memory: 1Gi

    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000

    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /data

      config:
        type: secret
        name: local-roborock-server
        globalMounts:
          - path: /app/config.toml
            subPath: config.toml
            readOnly: true

      certs:
        type: secret
        name: local-roborock-server-certs
        globalMounts:
          - path: /data/certs/fullchain.pem
            subPath: fullchain.pem
            readOnly: true
          - path: /data/certs/privkey.pem
            subPath: privkey.pem
            readOnly: true

    service:
      app:
        type: LoadBalancer
        labels:
          network: iot
        annotations:
          lbipam.cilium.io/ips: 10.1.30.9
        externalTrafficPolicy: Local
        ports:
          https:
            port: 555
          mqtt-tls:
            port: 8881
