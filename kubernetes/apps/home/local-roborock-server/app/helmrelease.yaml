---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: local-roborock-server
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: local-roborock-server
  values:
    controllers:
      local-roborock-server:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              # Built from upstream main (commit 02a1770) — includes the multi-vacuum
              # DUID/DID bridge-mapping fix (#165/#166) not yet in a tagged release.
              repository: git.noms.tv/homelab/local-roborock-server
              tag: main-02a1770@sha256:5aa8a4686874fdf2988f059d9a06490e035f7cbd18a46589b61845af4c735a19
            securityContext:
              capabilities:
                add:
                  - NET_BIND_SERVICE
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /admin
                    port: 555
                    scheme: HTTPS
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /admin
                    port: 555
                    scheme: HTTPS
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /admin
                    port: 555
                    scheme: HTTPS
                  periodSeconds: 5
                  failureThreshold: 30
            resources:
              requests:
                cpu: 100m
              limits:
                memory: 1Gi

    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000

    route:
      app:
        hostnames:
          - "roborock.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - name: root-redirect
            matches:
              - path:
                  type: Exact
                  value: /
            filters:
              - type: RequestRedirect
                requestRedirect:
                  path:
                    type: ReplaceFullPath
                    replaceFullPath: /admin
                  statusCode: 302
          - name: backend
            backendRefs:
              - identifier: app
                port: https

    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /data

      config:
        type: secret
        name: local-roborock-server
        globalMounts:
          - path: /app/config.toml
            subPath: config.toml
            readOnly: true

      certs:
        type: secret
        name: local-roborock-server-certs
        globalMounts:
          - path: /data/certs/fullchain.pem
            subPath: fullchain.pem
            readOnly: true
          - path: /data/certs/privkey.pem
            subPath: privkey.pem
            readOnly: true

    service:
      app:
        type: LoadBalancer
        labels:
          network: L2Announce-IoT
        annotations:
          lbipam.cilium.io/ips: 10.1.30.9
        externalTrafficPolicy: Local
        ports:
          https:
            port: 555
            appProtocol: https
          mqtt-tls:
            port: 8881
