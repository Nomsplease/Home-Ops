---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app music-assistant
  namespace: &namespace home
spec:
  components:
    - ../../../../components/kopiur/backup
  dependsOn:
    - name: kopiur
      namespace: kopiur-system
  interval: 30m
  patches:
    # Bind directly to the pre-existing Ceph RBD volume migrated from default/music-assistant, skipping the kopiur Restore populator.
    - patch: |-
        - op: add
          path: /spec/volumeName
          value: pvc-43573e08-0adb-4dd0-99e1-1ceb003b97d7
      target:
        kind: PersistentVolumeClaim
  path: ./kubernetes/apps/home/music-assistant/app
  postBuild:
    substitute:
      APP: *app
      KOPIUR_CAPACITY: 5Gi
  prune: true 
  retryInterval: 1m
  sourceRef:
    kind: OCIRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false