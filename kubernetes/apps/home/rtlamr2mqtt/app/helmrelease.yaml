---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rtlamr2mqtt
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: rtlamr2mqtt
  values:
    controllers:
      rtlamr2mqtt :
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: allangood/rtlamr2mqtt
              tag: 2026.10.15@sha256:6e7315df0b06f8293504077a7c0d751d36cc0421366db44c7cdf85fd9f06ef30
            securityContext:
              privileged: true
            ## Enable to List all devices
            # env:
            #   - name: LISTEN_ONLY
            #     value: yes
            #   - name: RTL_MSGTYPE
            #     value: "ALL"
            ##
    defaultPodOptions:
      nodeSelector:
        nesdr.feature.node.kubernetes.io/rtlamr: "true"
    persistence:
      config:
        type: secret
        name: rtlamr2mqtt
        globalMounts:
          - path: /etc/rtlamr2mqtt.yaml
            subPath: rtlamr2mqtt.yaml
            readOnly: true