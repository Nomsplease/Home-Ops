---
# yaml-language-server: $schema=https://json.schemastore.org/kubernetes-role.json
# The kopiur chart's ClusterRole grants get/list/watch/create on secrets but
# never delete, so the controller's own finalizer cleanup (deleting the
# per-ClusterRepository <name>-kopia-ui-auth secret) fails with 403 Forbidden
# and retries forever, leaving the ClusterRepository stuck Terminating.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kopiur-secrets-delete
  namespace: kopiur-system
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kopiur-secrets-delete
  namespace: kopiur-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kopiur-secrets-delete
subjects:
  - kind: ServiceAccount
    name: kopiur
    namespace: kopiur-system
