---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/clusterrepository_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: garage
spec:
  allowedNamespaces:
    all: true
  bootstrap:
    failurePolicy:
      activeDeadlineSeconds: 900
  backend:
    s3:
      auth:
        secretRef:
          name: kopiur-repository-secret
          namespace: kopiur-system
      bucket: homelab
      prefix: kopiur/
      endpoint: truenas.services:3900
      region: "${GARAGE_REGION}"
  encryption:
    passwordSecretRef:
      name: kopiur-repository-secret
      namespace: kopiur-system
      key: KOPIA_PASSWORD
  parameters:
    epoch:
      minDuration: 6h
  scheduleDefaults:
    timezone: America/New_York
  server:
    namespace: kopiur-system
    auth:
      insecure:
        acknowledgeInsecure: true