---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/clusterrepository_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: truenas-internal
spec:
  allowedNamespaces:
    all: true
  bootstrap:
    failurePolicy:
      activeDeadlineSeconds: 900
  backend:
    s3:
      auth:
        secretRef:
          name: kopiur-repository-internal-secret
          namespace: kopiur-system
      bucket: homelab
      prefix: kopiur/
      endpoint: https://truenas.services:9000
      region: us-east-1
      tls:
        disableTls: true
  encryption:
    passwordSecretRef:
      name: kopiur-repository-internal-secret
      namespace: kopiur-system
      key: KOPIA_PASSWORD
  parameters:
    epoch:
      minDuration: 6h
  scheduleDefaults:
    timezone: America/New_York
  server:
    namespace: kopiur-system
    auth:
      insecure:
        acknowledgeInsecure: true
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/clusterrepository_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: truenas-kwh
spec:
  allowedNamespaces:
    all: true
  bootstrap:
    failurePolicy:
      activeDeadlineSeconds: 900
  backend:
    s3:
      auth:
        secretRef:
          name: kopiur-repository-kwh-secret
          namespace: kopiur-system
      bucket: homelab
      prefix: kopiur/
      endpoint: https://10.3.10.10:9000
      region: us-east-1
      tls:
        disableTls: true
  encryption:
    passwordSecretRef:
      name: kopiur-repository-kwh-secret
      namespace: kopiur-system
      key: KOPIA_PASSWORD
  parameters:
    epoch:
      minDuration: 6h
  scheduleDefaults:
    timezone: America/New_York
