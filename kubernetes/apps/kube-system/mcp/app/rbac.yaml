---
# yaml-language-server: $schema=https://json.schemastore.org/kubernetes-serviceaccount.json
# Token identity for Hermes's external kubernetes-mcp-server (TrueNas).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hermes
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hermes-cluster-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: hermes
    namespace: kube-system
---
apiVersion: v1
kind: Secret
metadata:
  name: hermes-token
  namespace: kube-system
  annotations:
    kubernetes.io/service-account.name: hermes
type: kubernetes.io/service-account-token
