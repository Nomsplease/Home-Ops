---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: node-feature-discovery
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: node-feature-discovery
  values:
    worker:
      config:
        core:
          sources: ["pci", "system", "usb"]
        sources:
          usb:
            # Default is ["0e", "ef", "fe", "ff"]; add 02 (CDC) for the KVM's serial port.
            deviceClassWhitelist: ["02", "0e", "ef", "fe", "ff"]
    prometheus:
      enable: false
