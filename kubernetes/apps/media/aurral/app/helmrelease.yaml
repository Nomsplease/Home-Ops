---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: aurral
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: aurral
  values:
    controllers:
      aurral:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/lklynet/aurral
              tag: 3.1.0@sha256:17d1f8ff2aaa3907d846c38b47eebdd44b10fbe00b2c993373a6da940ac2504f
            env:
              LIBRARY_FOLDER: /media/Music
              PORT: &port 80
              PUID: 1000
              PGID: 1000
              TRUST_PROXY: "true"
              TZ: America/New_York
              AURRAL_PUBLIC_URL: "https://music.${SECRET_DOMAIN}"
              OIDC_ENABLED: "true"
              OIDC_REDIRECT_URI: "https://music.${SECRET_DOMAIN}/sso/callback"
              OIDC_ISSUER:
                valueFrom:
                  secretKeyRef:
                    name: aurral-oidc-credentials
                    key: OIDC_ISSUER_URL
              OIDC_CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    name: aurral-oidc-credentials
                    key: OIDC_CLIENT_ID
              OIDC_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: aurral-oidc-credentials
                    key: OIDC_CLIENT_SECRET
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 180
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 4Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
          - "music.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
          - name: envoy-external
            namespace: network
            sectionName: https
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
      media:
        type: nfs
        server: truenas.hme.${SECRET_DOMAIN}
        path: /mnt/BigPool/Media