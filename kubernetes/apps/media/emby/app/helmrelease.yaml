---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: emby
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: emby
  values:
    controllers:
      emby:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          install-plugins:
            image:
              repository: docker.io/alpine
              tag: 3.24@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
            env:
              # renovate: datasource=github-releases depName=Tracearr/Media-Server-SSE
              SSE_VERSION: v0.5.1
              # renovate: datasource=github-releases depName=fscorrupt/posterizarr
              POSTERIZARR_VERSION: "3.3.7"
            command:
              - sh
              - -ec
              - |
                cache=/config/.plugin-cache
                mkdir -p "$cache" /config/plugins

                install_plugin() {
                  url="$1"; zip="$2"; dll="$3"; prune_glob="$4"
                  cached="$cache/$zip"
                  if [ ! -f "$cached" ]; then
                    wget -q -O "$cached" "$url"
                    find "$cache" -maxdepth 1 -name "$prune_glob" ! -name "$zip" -delete
                  fi
                  want=$(unzip -p "$cached" "$dll" | sha256sum | cut -d' ' -f1)
                  have=""
                  [ -f "/config/plugins/$dll" ] && have=$(sha256sum "/config/plugins/$dll" | cut -d' ' -f1)
                  [ "$want" = "$have" ] || unzip -o "$cached" -d /config/plugins
                }

                sse_ver="$${SSE_VERSION#v}"
                install_plugin \
                  "https://github.com/Tracearr/Media-Server-SSE/releases/download/$SSE_VERSION/Tracearr.Sse.Emby_$sse_ver.zip" \
                  "Tracearr.Sse.Emby_$sse_ver.zip" \
                  "Emby.Plugin.Sse.dll" \
                  "Tracearr.Sse.Emby_*.zip"

                install_plugin \
                  "https://github.com/fscorrupt/posterizarr/releases/download/$POSTERIZARR_VERSION/Posterizarr.Plugin.Emby_v$POSTERIZARR_VERSION.zip" \
                  "Posterizarr.Plugin.Emby_v$POSTERIZARR_VERSION.zip" \
                  "Posterizarr.Plugin.Emby.dll" \
                  "Posterizarr.Plugin.Emby_v*.zip"
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/emby
              tag: 4.10.2.0@sha256:3926aa2a20747561bdd7d8885f5e6bdc335c89c9a15cb0e55ec9a3b636c1d598
            env:
              TZ: America/New_York
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /System/Ping
                    port: &port 8096
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 100m
              limits:
                gpu.intel.com/i915: 1
                memory: 16Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: *port
    # route:
    #   app:
    #     hostnames:
    #       - "{{ .Release.Name }}.${SECRET_DOMAIN}"
    #     parentRefs:
    #       - name: envoy-external
    #         namespace: network
    #         sectionName: https
    #     rules:
    #       # Native Emby clients (apps, TVs, casting) can't complete a browser OIDC
    #       # redirect, so these paths skip forward auth. The oidc/envoy-partial
    #       # component only targets the "protected" rule below via sectionName.
    #       - name: bypass
    #         matches:
    #           - path:
    #               type: RegularExpression
    #               value: ^/emby($|/.*)
    #           - path:
    #               type: RegularExpression
    #               value: ^/embywebsocket($|/.*)
    #           - path:
    #               type: RegularExpression
    #               value: ^/websocket($|/.*)
    #           - path:
    #               type: RegularExpression
    #               value: ^/emby/Sessions($|/.*)
    #           - path:
    #               type: RegularExpression
    #               value: ^/emby/Users($|/.*)
    #           - path:
    #               type: RegularExpression
    #               value: ^/emby/System/Info
    #         backendRefs:
    #           - identifier: app
    #             port: *port
    #       - name: protected
    #         backendRefs:
    #           - identifier: app
    #             port: *port
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
          - name: envoy-internal
            namespace: network
            sectionName: https
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
      media:
        type: nfs
        server: truenas-k8s.hme.${SECRET_DOMAIN}
        path: /mnt/BigPool/Media
      transcode:
        type: emptyDir