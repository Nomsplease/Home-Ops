---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: emby
spec:
  components:
    - ../../../../components/kopiur/backup
    - ../../../../components/zeroscaler
  dependsOn:
    - name: intel-device-plugins-gpu
      namespace: kube-system
    - name: kopiur
      namespace: kopiur-system
    - name: pocket-id
      namespace: security
  interval: 30m
  path: ./kubernetes/apps/media/emby/app
  postBuild:
    substitute:
      APP: emby
      APP_ICON_URL: "https://cdn.jsdelivr.net/gh/selfhst/icons/svg/emby.svg"
      KOPIUR_CAPACITY: 150Gi
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true 
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: media
  timeout: 5m
  wait: false