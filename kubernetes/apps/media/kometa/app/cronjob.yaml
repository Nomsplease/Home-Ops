---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: kometa
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  concurrencyPolicy: Forbid
  schedule: "0 */4 * * *"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
          containers:
            - name: kometa
              image: kometateam/kometa:v2.5.0@sha256:a8a3e3269158bfd9855bb4d46b8763df75ec511a66a41f4b5ea81de8604d22af
              args: ["--run", "--read-only-config"]
              env:
                - name: KOMETA_CONFIG
                  value: /posters/couchpotatocentral_config.yml
                - name: TZ
                  value: ${TIMEZONE}
              resources:
                requests:
                  cpu: 50m
                  memory: 512Mi
                limits:
                  memory: 4Gi
              volumeMounts:
                - name: posters
                  mountPath: /posters
          volumes:
            - name: posters
              nfs:
                server: truenas-k8s.hme.${SECRET_DOMAIN}
                path: /mnt/BigPool/Media/Posters
          restartPolicy: OnFailure
