---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: picard
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: picard
  values:
    controllers:
      picard:
        forceRename: picard
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: jlesage/musicbrainz-picard
              tag: v26.10.2@sha256:8156be84eb7d6835f7f9e324ed2e408b0e430505f9c7c7ce62dd658569c55a4a
            env:
              DARK_MODE: "1"
              KEEP_APP_RUNNING: "1"
              TZ: ${TIMEZONE}
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 4Gi

    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
      media:
        type: nfs
        server: truenas-k8s.hme.${SECRET_DOMAIN}
        path: /mnt/BigPool/Media

    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: http

    service:
      app:
        controller: picard
        forceRename: picard
        ports:
          http:
            port: 5800