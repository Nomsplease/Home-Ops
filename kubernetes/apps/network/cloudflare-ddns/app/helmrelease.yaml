---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudflare-ddns
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: cloudflare-ddns
  values:
    controllers:
      cloudflare-ddns :
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: favonia/cloudflare-ddns
              tag: 1.17.1@sha256:5e61736b982b87d84a1120b4767c4deff0f2cc55ca3ee9dcb1dc58623039b5cb
            env:
              PROXIED: "false"
              IP6_PROVIDER: "none"
            envFrom:
              - secretRef:
                  name: cloudflare-ddns
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 128Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000