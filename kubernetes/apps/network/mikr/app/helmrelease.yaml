---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mikr
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: mikr
  values:
    controllers:
      mikr:
        forceRename: mikr
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/hreskiv/mikr
              tag: 1.76.0@sha256:5ee4e2ad6481ac909b81378ff4b0f7fece80ce582dd8a7c398dab317d7525dc9
            env:
              METRICS_ENABLED: "true"
              TZ: ${TIMEZONE}
              WEBAUTHN_ORIGINS: "{{ .Release.Name }}.${SECRET_DOMAIN}"
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 2Gi

    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000

    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /app/data

    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: mikr
                port: http

    service:
      mikr:
        controller: mikr
        forceRename: mikr
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: 10.1.20.27
        ports:
          http:
            port: 3000
          syslog-tcp:
            port: 5514
          syslog-udp:
            port: 5514
            protocol: UDP

