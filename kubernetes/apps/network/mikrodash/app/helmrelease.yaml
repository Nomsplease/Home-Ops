---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mikrodash
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: mikrodash
  values:
    controllers:
      mikrodash:
        forceRename: mikrodash
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/secops-7/mikrodash
              tag: 0.8.80@sha256:ab841d00f5f0aeb11c8425e261cde33f6a17acec1e1b9d404078a26ca9362b89
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 2Gi

    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000

    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"

    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: mikrodash
                port: http

    service:
      mikrodash:
        controller: mikrodash
        forceRename: mikrodash
        ports:
          http:
            port: 3081

