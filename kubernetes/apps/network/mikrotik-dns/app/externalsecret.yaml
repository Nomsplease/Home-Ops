---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mikrotik-dns
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: mikrotik-dns-secret
    template:
      data:
        MIKROTIK_BASEURL: https://10.1.10.1
        MIKROTIK_USERNAME: "{{ .apiUsername }}"
        MIKROTIK_PASSWORD: "{{ .apiPassword }}"
        MIKROTIK_SKIP_TLS_VERIFY: "true"
  dataFrom:
    - extract:
        key: mikrotik-dns
