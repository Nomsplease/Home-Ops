---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbird
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: netbird
    template:
      engineVersion: v2
      data:
        ## Embedded IdP
        AUTH_AUDIENCE: "{{ .AuthAudience }}"
        AUTH_CLIENT_ID: "{{ .AuthClientID }}"
        AUTH_CLIENT_SECRET: "{{ .AuthClientSecret }}"
        config.yaml: |-
          server:
            listenAddress: ":80"
            exposedAddress: "https://netbird.${SECRET_DOMAIN}:443"
            stunPorts:
              - 3478
            metricsPort: 9090
            healthcheckAddress: ":9000"
            logLevel: "info"
            logFile: "console"

            authSecret: "{{ .authSecret }}"
            dataDir: "/data"

            auth:
              issuer: "https://netbird.${SECRET_DOMAIN}/oauth2"
              signKeyRefreshEnabled: true
              sessionCookieEncryptionKey: "{{ .sessionCookieEncryptionKey }}"
              dashboardRedirectURIs:
                - "https://netbird.${SECRET_DOMAIN}/nb-auth"
                - "https://netbird.${SECRET_DOMAIN}/nb-silent-auth"
              cliRedirectURIs:
                - "http://localhost:53000/"

            reverseProxy:
              trustedHTTPProxies:
                - "172.20.0.0/16"

            store:
              engine: "sqlite"
              encryptionKey: "{{ .encryptionKey }}"
  dataFrom:
    - extract:
        key: netbird