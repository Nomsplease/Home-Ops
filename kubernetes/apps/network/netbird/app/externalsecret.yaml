---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbird
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: netbird
    template:
      engineVersion: v2
      data:
        NETBIRD_AUTH_OIDC_CONFIGURATION_ENDPOINT: "{{ .oidcDiscoveryURL }}"
        NETBIRD_USE_AUTH0: "false"
        NETBIRD_AUTH_CLIENT_ID: "{{ .OIDCClientID }}"
        NETBIRD_AUTH_SUPPORTED_SCOPES: "openid profile email groups"
        NETBIRD_AUTH_AUDIENCE: "{{ .OIDCClientID }}"
        NETBIRD_AUTH_REDIRECT_URI: "/auth"
        NETBIRD_AUTH_SILENT_REDIRECT_URI: "/silent-auth"
        NETBIRD_TOKEN_SOURCE: "idToken"

        NETBIRD_AUTH_DEVICE_AUTH_PROVIDER: "none"
        NETBIRD_AUTH_DEVICE_AUTH_CLIENT_ID: "{{ .OIDCClientID }}"
        NETBIRD_AUTH_DEVICE_AUTH_AUDIENCE: "{{ .OIDCClientID }}"
        NETBIRD_AUTH_DEVICE_AUTH_SCOPE: "openid profile email groups"
        NETBIRD_AUTH_DEVICE_AUTH_USE_ID_TOKEN: "true"

        NETBIRD_MGMT_IDP: "pocketid"
        NETBIRD_IDP_MGMT_CLIENT_ID: "netbird"
        NETBIRD_IDP_MGMT_EXTRA_MANAGEMENT_ENDPOINT: "{{ .issuerURL }}"
        NETBIRD_IDP_MGMT_EXTRA_API_TOKEN: "{{ .NetBirdManagementToken }}"

        ## Dashboard container reads these bare (non-NETBIRD_-prefixed) names
        AUTH_AUDIENCE: "{{ .OIDCClientID }}"
        AUTH_CLIENT_ID: "{{ .OIDCClientID }}"
        AUTH_CLIENT_SECRET: ""
        AUTH_AUTHORITY: "{{ .issuerURL }}"
        config.yaml: |-
          server:
            listenAddress: ":80"
            exposedAddress: "https://netbird.${SECRET_DOMAIN}:443"
            stunPorts:
              - 3478
            metricsPort: 9090
            healthcheckAddress: ":9000"
            logLevel: "info"
            logFile: "console"

            authSecret: "{{ .authSecret }}"
            dataDir: "/data"

            auth:
              sessionCookieEncryptionKey: "{{ .sessionCookieEncryptionKey }}"
              cliRedirectURIs:
                - "http://localhost:53000"

            reverseProxy:
              trustedHTTPProxies:
                - "172.20.0.0/16"

            store:
              engine: "sqlite"
              encryptionKey: "{{ .encryptionKey }}"
  dataFrom:
    - extract:
        key: netbird