---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: powerdns-admin
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: powerdns-admin
  values:
    controllers:
      powerdns-admin-hme:
        forceRename: powerdns-admin-hme
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/powerdnsadmin/pda-legacy
              tag: 0.6.1
            env:
              SECRET_KEY:
                valueFrom:
                  secretKeyRef:
                    name: powerdns-admin-secret
                    key: SECRET_KEY
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 1Gi

      powerdns-admin-par:
        forceRename: powerdns-admin-par
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/powerdnsadmin/pda-legacy
              tag: 0.6.1
            env:
              SECRET_KEY:
                valueFrom:
                  secretKeyRef:
                    name: powerdns-admin-secret
                    key: SECRET_KEY
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 1Gi

    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"

    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        advancedMounts:
          powerdns-admin-hme:
            app:
              - path: /data
                subPath: hme
          powerdns-admin-par:
            app:
              - path: /data
                subPath: par

    route:
      app-hme:
        hostnames:
          - "dnsadmin-hme.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: powerdns-admin-hme
                port: http
      app-par:
        hostnames:
          - "dnsadmin-par.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: powerdns-admin-par
                port: http

    service:
      powerdns-admin-hme:
        controller: powerdns-admin-hme
        forceRename: powerdns-admin-hme
        ports:
          http:
            port: 80
      powerdns-admin-par:
        controller: powerdns-admin-par
        forceRename: powerdns-admin-par
        ports:
          http:
            port: 80
