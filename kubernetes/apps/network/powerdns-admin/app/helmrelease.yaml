---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: powerdns-admin
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: powerdns-admin
  values:
    controllers:
      powerdns-admin:
        forceRename: powerdns-admin
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/powerdnsadmin/pda-legacy
              tag: 0.6.1
            env:
              SECRET_KEY:
                valueFrom:
                  secretKeyRef:
                    name: powerdns-admin-secret
                    key: SECRET_KEY
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 512Mi

    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /data

    route:
      app:
        hostnames:
          - "dnsadmin.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: powerdns-admin
                port: http

    service:
      powerdns-admin:
        controller: powerdns-admin
        forceRename: powerdns-admin
        ports:
          http:
            port: 80
