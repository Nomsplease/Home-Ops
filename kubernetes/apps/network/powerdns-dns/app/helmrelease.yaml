---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app powerdns-dns
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  values:
    fullnameOverride: *app
    env:
      - name: &name PDNS_API_KEY
        valueFrom:
          secretKeyRef:
            name: &secret powerdns-dns-secret
            key: *name
    provider:
      name: pdns
    extraArgs:
      - --ignore-ingress-tls-spec
      - --pdns-server=http://10.1.20.1:8081
      - --pdns-api-key=$(PDNS_API_KEY)
    triggerLoopOnEvent: true
    policy: sync
    sources:
      - gateway-httproute
      - service
    txtOwnerId: default
    txtPrefix: k8s.
    domainFilters:
      - noms.tv
    serviceMonitor:
      enabled: true
    podAnnotations:
      secret.reloader.stakater.com/reload: *secret
