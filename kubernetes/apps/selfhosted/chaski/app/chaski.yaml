targets:
  matrix-media:
    apprise:
      url: '{{ env "MATRIX_APPRISE_URL_MEDIA" }}'
  matrix-finances:
    apprise:
      url: '{{ env "MATRIX_APPRISE_URL_FINANCES" }}'

routes:
  seerr:
    target: matrix-media
    verify:
      token:
        header: Authorization
        secret: '{{ env "CHASKI_WEBHOOK_SECRET" }}'
    title: "{{ .payload.subject }}"
    message: |-
      {{ .payload.message }}
      {{- with .payload.media }}
      {{ .media_type }} · {{ .status }}
      {{- end }}
      {{- with .payload.request }}
      Requested by {{ .requestedBy_username }}
      {{- end }}
      {{- with .payload.issue }}
      Issue #{{ .issue_id }} ({{ .issue_type }}, {{ .issue_status }}) reported by {{ .reportedBy_username }}
      {{- end }}
      {{- with .payload.comment }}
      {{ .commentedBy_username }}: {{ .comment_message }}
      {{- end }}
  maintainerr:
    target: matrix-media
    verify:
      token:
        header: Authorization
        secret: '{{ env "CHASKI_WEBHOOK_SECRET" }}'
    title: "{{ .payload.subject }}"
    message: |-
      {{ .payload.message }}
      {{- if .payload.collectionName }}
      Collection: {{ .payload.collectionName }}
      {{- end }}
      {{- if .payload.dayAmount }}
      Days until handled: {{ .payload.dayAmount }}
      {{- end }}
  wallos:
    target: matrix-finances
    verify:
      token:
        header: Authorization
        secret: '{{ env "CHASKI_WEBHOOK_SECRET" }}'
    title: "{{ .payload.name }} — {{ .payload.price }} {{ .payload.currency }}"
    message: |-
      Due {{ .payload.date }} ({{ .payload.days }} days)
      Category: {{ .payload.category }}
      Payer: {{ .payload.payer }}
      {{- if .payload.notes }}
      Notes: {{ .payload.notes }}
      {{- end }}
      {{- if .payload.url }}
      {{ .payload.url }}
      {{- end }}
