targets:
  matrix-media:
    apprise:
      url: 'matrixs://{{ env "MATRIX_BOT_TOKEN" }}@matrix.${SECRET_DOMAIN}/{{ env "ROOM_ID_MEDIA" }}'

routes:
  seerr:
    target: matrix-media
    verify:
      token:
        header: Authorization
        secret: '{{ env "CHASKI_WEBHOOK_SECRET" }}'
    title: "{{ .payload.subject }}"
    message: |-
      {{ .payload.message }}
      {{- with .payload.media }}
      {{ .media_type }} · {{ .status }}
      {{- end }}
      {{- with .payload.request }}
      Requested by {{ .requestedBy_username }}
      {{- end }}
      {{- with .payload.issue }}
      Issue #{{ .issue_id }} ({{ .issue_type }}, {{ .issue_status }}) reported by {{ .reportedBy_username }}
      {{- end }}
      {{- with .payload.comment }}
      {{ .commentedBy_username }}: {{ .comment_message }}
      {{- end }}
  maintainerr:
    target: matrix-media
    verify:
      token:
        header: Authorization
        secret: '{{ env "CHASKI_WEBHOOK_SECRET" }}'
    title: "{{ .payload.subject }}"
    message: "{{ .payload.message }}"
