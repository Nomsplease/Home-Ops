---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: chaski
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: chaski-secret
    template:
      data:
        MATRIX_APPRISE_URL_MEDIA: "matrixs://{{ .botToken }}@matrix.${SECRET_DOMAIN}/{{ .RoomIDMedia }}?hsreq=no"
        MATRIX_APPRISE_URL_FINANCES: "matrixs://{{ .botToken }}@matrix.${SECRET_DOMAIN}/{{ .RoomIDFinances }}?hsreq=no"
        CHASKI_WEBHOOK_SECRET: "{{ .webhookToken }}"
        MOONFIN_WEBHOOK_URL: "http://emby.media.svc.cluster.local:8096/Moonfin/Seerr/Webhook?secret={{ .MoonfinWebhookSecret }}"
  dataFrom:
    - extract:
        key: chaski
