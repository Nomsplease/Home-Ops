---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: chaski
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: chaski-secret
    template:
      data:
        MATRIX_BOT_TOKEN: "{{ .botToken }}"
        ROOM_ID_MEDIA: "{{ .RoomIDMedia }}"
        CHASKI_WEBHOOK_SECRET: "{{ .webhookToken }}"
  dataFrom:
    - extract:
        key: chaski
