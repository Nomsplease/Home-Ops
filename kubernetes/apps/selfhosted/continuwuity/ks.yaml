---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app continuwuity
  namespace: &namespace selfhosted
spec:
  components:
    - ../../../../components/kopiur/backup
    - ../../../../components/oidc
  dependsOn:
    - name: kopiur
      namespace: kopiur-system
    - name: pocket-id
      namespace: security
  interval: 30m
  path: ./kubernetes/apps/selfhosted/continuwuity/app
  postBuild:
    substitute:
      APP: *app
      APP_ICON_URL: "https://cdn.jsdelivr.net/gh/selfhst/icons/svg/matrix.svg"
      OIDC_APP_NAME: Continuwuity
      OIDC_CALLBACK_PATH: /_continuwuity/oidc/complete
      SUBDOMAIN: matrix
      KOPIUR_CAPACITY: 10Gi
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: OCIRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false
