---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dawarich
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: dawarich
  values:
    controllers:
      dawarich:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/freikin/dawarich
              tag: 1.22.0@sha256:b8ee8d9fdff92a9d6ca570f98e0e875624f4bfb24b61363f8246bba124d5849d
            command:
              - web-entrypoint.sh
            args:
              - bin/rails
              - server
              - -p
              - "3000"
              - -b
              - "::"
            env:
              PUID: "1000"
              PGID: "1000"
              RAILS_LOG_TO_STDOUT: "true"
              SELF_HOSTED: "true"
              SIDEKIQ_EMBEDDED: "true"
              WEB_CONCURRENCY: "0"
              TIME_ZONE: ${TIMEZONE}
              APPLICATION_HOSTS: "dawarich.${SECRET_DOMAIN}"
              APPLICATION_PROTOCOL: https
              REDIS_URL: redis://dragonfly.databases:6379/8
              DATABASE_HOST: postgres-rw.databases.svc
              DATABASE_PORT: "5432"
              DATABASE_NAME: "{{ .Release.Name }}"
              DATABASE_USERNAME: "{{ .Release.Name }}"
              DATABASE_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: "{{ .Release.Name }}-postgres"
                    key: password
              SECRET_KEY_BASE:
                valueFrom:
                  secretKeyRef:
                    name: "{{ .Release.Name }}"
                    key: secret_key_base
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/health
                    port: 3000
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 10
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/health
                    port: 3000
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 10
                  failureThreshold: 5
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 4Gi
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: 3000
    route:
      app:
        hostnames:
          - "dawarich.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: 3000
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /var/app/public
            subPath: public
          - path: /var/app/tmp/imports/watched
            subPath: watched
          - path: /var/app/storage
            subPath: storage
