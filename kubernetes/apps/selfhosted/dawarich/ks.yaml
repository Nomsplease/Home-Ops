---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app dawarich
  namespace: &namespace selfhosted
spec:
  components:
    - ../../../../components/kopiur/backup
    - ../../../../components/postgres/pass
  dependsOn:
    - name: cloudnative-pg-cluster
      namespace: databases
    - name: kopiur
      namespace: kopiur-system
  interval: 30m
  path: ./kubernetes/apps/selfhosted/dawarich/app
  postBuild:
    substitute:
      APP: *app
      DATABASE_EXTENSIONS: |
        [
          { name: postgis }
        ]
      KOPIUR_CAPACITY: 20Gi
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: OCIRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false
