---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mattermost-s3
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: mattermost-s3
    template:
      data:
        accesskey: "{{ .MATTERMOST_INT_KEY_ID }}"
        secretkey: "{{ .MATTERMOST_INT_SECRET_KEY }}"
  dataFrom:
    - extract:
        key: mattermost
