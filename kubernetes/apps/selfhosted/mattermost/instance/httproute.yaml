---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mattermost
spec:
  hostnames:
    - mattermost.${SECRET_DOMAIN}
    - chat.${SECRET_DOMAIN}
  parentRefs:
    - name: envoy-external
      namespace: network
    - name: envoy-internal
      namespace: network
  rules:
    - name: mobile-bridge
      matches:
        - path: { type: Exact, value: /api/v4/config/client }
        - path: { type: Exact, value: /oauth/openid/mobile_login }
      backendRefs:
        - name: mattermost-mobile-bridge
          port: 8066
    - name: backend
      backendRefs:
        - name: mattermost
          port: 8065
