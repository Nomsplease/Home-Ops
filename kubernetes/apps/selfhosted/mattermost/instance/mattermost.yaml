---
apiVersion: installation.mattermost.com/v1beta1
kind: Mattermost
metadata:
  name: mattermost
spec:
  image: mattermost/mattermost-team-edition
  version: "12.1.0"
  replicas: 1
  ingress:
    enabled: false
  database:
    external:
      secret: mattermost-postgres
    disableReadinessCheck: true
  fileStore:
    external:
      url: s3.hme.${SECRET_DOMAIN}
      bucket: mattermost
      secret: mattermost-s3
  mattermostEnv:
    - name: MM_FILESETTINGS_AMAZONS3SSL
      value: "true"
    - name: MM_FILESETTINGS_AMAZONS3REGION
      value: "${GARAGE_REGION}"
    - name: MM_FILESETTINGS_AMAZONS3PATHPREFIX
      value: mattermost
  scheduling:
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        memory: 1Gi
