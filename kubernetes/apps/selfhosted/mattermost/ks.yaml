---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mattermost-operator
  namespace: selfhosted
spec:
  interval: 1h
  path: ./kubernetes/apps/selfhosted/mattermost/app
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: OCIRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: selfhosted
  timeout: 5m
  wait: true
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app mattermost
  namespace: selfhosted
spec:
  components:
    - ../../../../components/postgres/pass
  dependsOn:
    - name: mattermost-operator
      namespace: selfhosted
    - name: cloudnative-pg-cluster
      namespace: databases
  healthChecks:
    - apiVersion: installation.mattermost.com/v1beta1
      kind: Mattermost
      name: mattermost
      namespace: selfhosted
  interval: 30m
  path: ./kubernetes/apps/selfhosted/mattermost/instance
  postBuild:
    substitute:
      APP: *app
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: OCIRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: selfhosted
  timeout: 5m
  wait: false
