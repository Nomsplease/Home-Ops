---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mattermost-mobile-bridge
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: mattermost-mobile-bridge
  values:
    controllers:
      app:
        containers:
          app:
            image:
              repository: ghcr.io/server-camp/mattermost-oidc-plugin/mobile-bridge
              tag: 0.8.0@sha256:7c29a36f86a5cfc63b3d3cab417419859c1012b7018b17a1e4527d2bbe2d21c4
            env:
              # Separate Deployment, not sidecar: CRD lacks a field for extra containers.
              UPSTREAM: http://mattermost.selfhosted.svc.cluster.local:8065
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 64Mi
    service:
      app:
        ports:
          http:
            port: 8066
