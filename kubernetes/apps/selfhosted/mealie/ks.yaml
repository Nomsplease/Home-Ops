---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app mealie
  namespace: &namespace selfhosted
spec:
  components:
    - ../../../../components/kopiur/backup
    - ../../../../components/postgres/cert
  dependsOn:
    - name: cloudnative-pg-cluster
      namespace: databases
    - name: kopiur
      namespace: kopiur-system
  interval: 30m
  patches:
    # Bind directly to the pre-existing Ceph RBD volume migrated from default/mealie (claimRef pre-targeted at this PVC), skipping the kopiur Restore populator.
    - patch: |-
        - op: add
          path: /spec/volumeName
          value: pvc-305f831c-0265-4cec-9b1f-9a298bf806ec
      target:
        kind: PersistentVolumeClaim
  path: ./kubernetes/apps/selfhosted/mealie/app
  postBuild:
    substitute:
      APP: *app
      KOPIUR_CAPACITY: 10Gi
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: OCIRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false