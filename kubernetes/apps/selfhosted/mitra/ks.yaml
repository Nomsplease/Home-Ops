---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app mitra
  namespace: &namespace selfhosted
spec:
  components:
    - ../../../../components/oidc/envoy
    - ../../../../components/kopiur/backup
  dependsOn:
    - name: kopiur
      namespace: kopiur-system
    - name: pocket-id
      namespace: security
  interval: 30m
  path: ./kubernetes/apps/selfhosted/mitra/app
  postBuild:
    substitute:
      APP: *app
      APP_ICON_URL: "https://raw.githubusercontent.com/a11delavar/mitra/refs/heads/main/assets/mitra.svg"
      OIDC_APP_NAME: Family Calendar (Mitra)
      KOPIUR_CAPACITY: 5Gi
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: OCIRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false
