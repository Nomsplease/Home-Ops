---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: securo
spec:
  hostnames:
    - "securo.${SECRET_DOMAIN}"
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - name: api
      matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: securo-backend
          port: 8000
    - name: mcp
      matches:
        - path:
            type: PathPrefix
            value: /mcp
      backendRefs:
        - name: securo-mcp-server
          port: 8765
    - name: frontend
      backendRefs:
        - name: securo-frontend
          port: 3000
