---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app spoolman
  namespace: &namespace selfhosted
spec:
  components:
    - ../../../../components/kopiur/backup
  dependsOn:
    - name: kopiur
      namespace: kopiur-system
  interval: 30m
  path: ./kubernetes/apps/selfhosted/spoolman/app
  patches:
    - patch: |-
        - op: add
          path: /spec/volumeName
          value: pvc-26792fcb-8906-4806-9193-30efc97fc4f4
      target:
        kind: PersistentVolumeClaim
  postBuild:
    substitute:
      APP: *app
      KOPIUR_CAPACITY: 5Gi
  prune: true 
  retryInterval: 1m
  sourceRef:
    kind: OCIRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false