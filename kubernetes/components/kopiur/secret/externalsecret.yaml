---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kopiur-repository-internal
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: kopiur-repository-internal-secret
    template:
      data:
        KOPIA_PASSWORD: "{{ .KOPIA_PASSWORD }}"
        AWS_ACCESS_KEY_ID: "{{ .INTERNAL_ACCESS_KEY_ID }}"
        AWS_SECRET_ACCESS_KEY: "{{ .INTERNAL_SECRET_ACCESS_KEY }}"
  dataFrom:
    - extract:
        key: kopiur
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kopiur-repository-kwh
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: kopiur-repository-kwh-secret
    template:
      data:
        KOPIA_PASSWORD: "{{ .KOPIA_PASSWORD }}"
        AWS_ACCESS_KEY_ID: "{{ .KWH_ACCESS_KEY_ID }}"
        AWS_SECRET_ACCESS_KEY: "{{ .KWH_SECRET_ACCESS_KEY }}"
  dataFrom:
    - extract:
        key: kopiur
